# Render Blueprint for GoFlow (Phase 4, Task 21; queue and workers: Phase 6,
# Task 27; the container image: Phase 11, Task 45).
#
# This file is public on GitHub, so it holds no secrets. Values marked
# "sync: false" are typed into the Render dashboard when the Blueprint is
# created, and can be changed there later.
services:
  - type: web
    name: goflow-api
    # Render builds the repo's Dockerfile and runs its ENTRYPOINT, the same
    # image docker compose runs locally. No buildCommand or startCommand.
    # Render passes every variable below to the build as a build argument;
    # the Dockerfile declares none, so none of them reach the image
    # (TestImageHoldsNoSettingsOrSecrets keeps it that way).
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt # next to the Neon database in AWS Frankfurt
    plan: free # 0.1 CPU, 512 MB; sleeps after 15 minutes without requests
    # Liveness only: /readyz would also wait for the database, and a paused
    # free Neon database could make a fresh deploy look unhealthy.
    healthCheckPath: /healthz
    # Deploy a commit on main only after its CI checks pass (Task 60). A
    # commit that fails .github/workflows/ci.yml never reaches production.
    autoDeployTrigger: checksPass
    # No maxShutdownDelaySeconds: Render refuses it on free services (the
    # first sync of Task 27 failed on it). The worker pool drains for 20 s
    # after SIGTERM; if Render kills the API sooner, unfinished jobs stay
    # 'processing' and the next start puts them back (worker.Pool.Run).
    envVars:
      - key: GOFLOW_DATABASE_URL # from Neon, with sslmode=verify-full
        sync: false
      - key: GOFLOW_REGISTRATION # "open" just long enough to create your account, then "closed"
        sync: false
      # A free instance has a tenth of a CPU. Cost 12 would make each login
      # take seconds there; 10 is the lowest the server accepts.
      - key: GOFLOW_BCRYPT_COST
        value: "10"
      # The queue below, over Render's private network: redis://red-...:6379.
      - key: GOFLOW_REDIS_URL
        fromService:
          type: keyvalue
          name: goflow-queue
          property: connectionString
      # The API runs the worker pool itself (background workers aren't free).
      # Two jobs at a time on a tenth of a CPU. ONE instance only: the pool
      # resets 'processing' jobs at startup.
      - key: GOFLOW_WORKERS
        value: "2"
      # Rate limits count per client address. Cloudflare sits in front of
      # Render and refuses any request that brings its own CF-Connecting-IP,
      # so the value that arrives is Cloudflare's (Task 37's experiment).
      # Never X-Forwarded-For: its first entry is whatever the client sent.
      - key: GOFLOW_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Protects GET /metrics. Render generates a random value once; read it
      # in the dashboard (Environment) when you want to look at the metrics.
      # Nothing polls /metrics on its own: a poller would keep this free
      # instance awake all month (Phase 10 decision).
      - key: GOFLOW_METRICS_TOKEN
        generateValue: true

  # Redis-compatible queue (Valkey). Free: no persistence, so a restart
  # empties the lists; the API's reconciler re-sends stuck jobs.
  - type: keyvalue
    name: goflow-queue
    region: frankfurt
    plan: free
    # Never drop keys to free memory: a dropped list is a set of lost jobs.
    # When memory is full, writes fail instead, and the outbox keeps the jobs.
    maxmemoryPolicy: noeviction
    # Empty list: no connections from the internet at all, only from
    # services in this workspace and region.
    ipAllowList: []
