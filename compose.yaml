# GoFlow's local stack (Phase 11): PostgreSQL, Valkey, the API built from
# the Dockerfile, and three workers from the same image (Phase 12).
# Start everything: docker compose up -d --build
# With Prometheus and Grafana as well (opt-in, profile "monitoring"):
#   docker compose --profile monitoring up -d --build
#
# Only for this machine. The passwords below are development defaults,
# fine here and nowhere else; the hosted setup is in render.yaml.
#
# Every port is published on 127.0.0.1 only. Docker's port rules bypass
# most host firewalls, so 0.0.0.0 would open them to the whole network.
name: goflow

services:
  postgres:
    image: postgres:17 # the same major version as Neon
    environment:
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: goflow
      POSTGRES_DB: goflow
    ports:
      - "127.0.0.1:5432:5432" # go test and psql from the host
    volumes:
      - pgdata:/var/lib/postgresql/data # PostgreSQL 17's path (18 moved it)
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/goflow-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goflow -d goflow"]
      interval: 2s
      timeout: 3s
      retries: 15

  valkey:
    image: valkey/valkey:8 # what Render's Key Value runs
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    image: goflow:dev
    environment:
      # Service names, not localhost: inside its container, localhost is
      # the API itself. Single-label names pass GoFlow's TLS check because
      # they only exist on this private network (urlcheck).
      GOFLOW_DATABASE_URL: postgres://goflow:goflow@postgres:5432/goflow?sslmode=disable
      GOFLOW_REDIS_URL: redis://valkey:6379/0
      # The API's own workers. scripts/loadtest.sh sets GOFLOW_API_WORKERS=0,
      # so only the worker containers run jobs and the count is exact.
      GOFLOW_WORKERS: "${GOFLOW_API_WORKERS:-2}"
      GOFLOW_REGISTRATION: open # local only: create your development account
      # Turns on /metrics for Prometheus (monitoring/prometheus.yml has the
      # same value). A development value, not a secret: Render generates
      # its own.
      GOFLOW_METRICS_TOKEN: local-development-metrics-token-not-a-secret
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # SIGTERM, then 30 s before SIGKILL: the worker pool drains for 20 s.
    stop_grace_period: 30s

  # Three worker processes (Phase 12) from the API's image, sharing
  # PostgreSQL and Valkey with the API's own two workers. Each job is held
  # under a lease, so they never run one job twice. More or fewer:
  #   docker compose up -d --scale worker=5
  # Containers are goflow-worker-1, -2, -3 (DEVELOPMENT.md has a crash test).
  worker:
    image: goflow:dev # built by the api service, never pulled
    pull_policy: never
    entrypoint: ["/usr/local/bin/worker"]
    environment:
      GOFLOW_DATABASE_URL: postgres://goflow:goflow@postgres:5432/goflow?sslmode=disable
      GOFLOW_REDIS_URL: redis://valkey:6379/0
      GOFLOW_WORKERS: "2"
    deploy:
      replicas: 3
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # The API runs the migrations; the worker needs them in place.
      api:
        condition: service_started
    stop_grace_period: 30s

  # Opt-in: these two start only with --profile monitoring.
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus # the numbers survive a restart of the stack
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Local only: anyone on this machine may look without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: goflow # development default, port on 127.0.0.1 only
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

# Named like the containers DEVELOPMENT.md used to start by hand, so an
# existing development database is picked up as it is.
volumes:
  pgdata:
    name: goflow-pgdata
  redisdata:
    name: goflow-redisdata
  promdata:
